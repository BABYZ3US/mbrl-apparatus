[project]
name = "mbrl-curvature"
version = "0.1.0"
description = "Curvature-regularized latent model-based RL (Hutchinson HVP Hessian penalty)"
requires-python = ">=3.10"
# CORE = the sealed runtime (docs/remote_execution.md): training code may
# import these and ONLY these (make seal-check enforces).
dependencies = [
    "onnx>=1.16",      # W11: policy export (torch.onnx needs it to serialize)
    "imageio>=2.34",   # W11: eval-episode GIF artifacts (mbrl.eval.video)
    "torch>=2.4",
    "numpy>=1.26",
    "gymnasium[classic-control]>=1.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.18",
    "joblib>=1.4",
]

[project.optional-dependencies]
mujoco = ["gymnasium[mujoco]>=1.0", "minari>=0.5"]
# analysis-side only — figures/dashboards run locally, never inside training
analysis = ["matplotlib>=3.8", "seaborn>=0.13", "tensorboard>=2.16", "tqdm>=4.66"]
viz = ["plotly>=5.20", "umap-learn>=0.5", "torchinfo>=1.8"]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# The lock reproduces the environment every ledger result was produced in
# (2026-06-08). Version bumps are EXPERIMENTS: re-lock deliberately, re-run
# make test-all + the apparatus regression (mlp-recipe anchor), then commit
# the new lock with that evidence — never drift implicitly.
constraint-dependencies = [
    "torch==2.5.1",
    "numpy==2.2.6",
    "gymnasium==1.3.0",
    "wandb==0.27.2",
    "joblib==1.4.2",
]

# Ruff is the CI/hook lint superset of the Makefile's advisory `pyflakes` gate
# (make lint runs `pyflakes ... || true`). It is NOT a runtime/dev dependency and
# is deliberately kept out of uv.lock / the sealed image — CI and hooks run it
# ephemerally via `uvx ruff` (so the lock-discipline in [tool.uv] is untouched).
#
# This config is tuned so `ruff check .` is GREEN on the current tree: it keeps the
# bug-class checks (pyflakes `F`, real `E` errors) and ignores the stylistic rules
# the apparatus uses on purpose — semicolon-compacted statements (E702/E703),
# assigned lambdas (E731), deliberate late imports for arg parsing (E402), the
# `l` comprehension variable (E741), line length (E501). `__init__.py` re-exports
# and unused test imports are allowed (per-file). Tighten later if desired.
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["godot-docs-html-master", "outputs", "results", "checkpoints"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E401", "E402", "E701", "E702", "E703", "E731", "E741", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]      # intentional re-exports (package public surface)
"tests/**" = ["F401"]          # advisory only; don't fail the suite on a stray test import

[tool.pytest.ini_options]
markers = ["slow: integration tests (full env loops); excluded by make test, run by make test-all"]
testpaths = ["tests"]

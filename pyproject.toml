[project]
name = "mbrl-curvature"
version = "0.1.0"
description = "Curvature-regularized latent model-based RL (Hutchinson HVP Hessian penalty)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "gymnasium[classic-control]>=1.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.18",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tensorboard>=2.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
mujoco = ["gymnasium[mujoco]>=1.0", "minari>=0.5"]
viz = ["plotly>=5.20", "umap-learn>=0.5", "torchinfo>=1.8"]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

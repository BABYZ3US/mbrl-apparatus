# @package _global_
# THE CHAMPION (2026-06-08): best evidence-backed formulation after bridge
# runs 1-9. Reward = SNR-calibrated spectral ensemble + high-clamp polynomial
# (runs 3/5: +33.7%/+48.3% supervised); dynamics = gaussian-affine (run 9:
# return parity, calibrated sigma corr 0.55-0.58, imagined-variance
# suppression 4-6 orders, replicated). Excluded with receipts: rational head
# (runs 6/8), Gram hybrid (run 2b), SNR-as-penalty (run 4), learned sigma
# (untested), full-MLP dynamics (run 9 ablation-only). RL validation of the
# spectral stack itself is still pending (colab_spectral) — this config is
# the recommended starting point, not yet an RL-validated claim.
experiment:
  name: champion
model:
  dynamics: gaussian     # calibrated p(z'|z,a); mean stays affine (R15-safe)
  latent_cap_mult: 1     # spectral rule: k = obs_dim
penalty:
  schedule:
    kind: cuberoot       # smooth floored decay only (spectral rule)
    floor: 1.0e-5
spectral:
  enabled: true
  sigma_w: auto          # ladder rungs at measured sigma* x cal_mults
  cal_mults: [0.5, 1.0, 2.0, 4.0]
  recal_every: 50        # drift insurance (re-probe; rebuild only on >2x move)
  poly:
    degrees: [1, 3]      # high-clamp shape (run-3 winner)
    coefs: [0.1, 10.0]
    shifts: [0, 0]

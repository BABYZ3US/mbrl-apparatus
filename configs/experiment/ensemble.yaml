# @package _global_
# ENSEMBLE ARM (2026-06-10): R15-safe deep-ensemble dynamics + epistemic
# pessimism. N independently-initialized AFFINE members (mbrl.models.ensemble;
# affinity tested per member) replace the single dynamics; every member
# regresses to the data; imagination steps through the ensemble MEAN and the
# imagined reward is discounted by ensemble DISAGREEMENT (PETS/MBPO-style):
#   r_im -= ensemble_pessimism * std_members(z')
# Hypothesis to validate: epistemic discounting suppresses model-exploitation
# in long-horizon imagination (compare imagine/return_var + eval/return vs the
# champion). Status: implementation-validated (tests incl. bitwise resume);
# NOT yet RL-validated — this config is the arm to run, not a claim.
# Sweep grid: algo.ensemble_pessimism in {0.0, 0.25, 0.5, 1.0} x seeds {0,1,2};
# algo.dynamics_ensemble in {3, 5}.
#
# CAMPAIGN 1 RESULT (2026-06-11, RunPod 3090, HalfCheetah@100k, members=5,
# 12/12 arms; full receipts results/runs/ens-p*):
#   final eval/return: p00 -395±77 | p025 -333±91 | p05 -373±23 | p10 -244±108
#   -> no eval regression anywhere; p=1.0 nominally best (~t=2.0 at n=3 vs
#      control — suggestive, NOT significant).
#   The variance criterion is INVALID as written: late imagine/penalty_var
#   <= 0.2 while imagine/return_var is 1e8-1e10 INCLUDING the p=0 control —
#   the explosion is the symexp reward tail, not the penalty and not
#   measurable model-exploitation. Next: replicate direction on the spectral
#   stack (ensemble_spectral, p in {0, 1.0}) where symexp is absent.
experiment:
  name: ensemble
model:
  dynamics: affine        # ensemble members are deterministic-affine (enforced)
algo:
  dynamics_ensemble: 5
  ensemble_pessimism: 0.5

defaults:
  - env: pendulum
  - _self_

seed: 0
device: auto            # auto -> cuda if available else cpu

experiment:
  name: dev

model:
  encoder: mlp          # mlp (deterministic) | vae (run 10: recon + KL ground
                        # the encoder — collapse structurally impossible; KL
                        # pull toward N(0,I) makes the latent near-stationary
                        # so sigma* stops drifting). Decoder = MLP (state obs);
                        # transposed-conv "normal map" decoder reserved for
                        # the pixel-task variant.
  vae:
    beta: 1.0e-3        # KL weight (small: regularize, don't strangle)
    recon_weight: 1.0
  dynamics: affine      # affine (deterministic) | gaussian (state probability
                        # transitions p(z'|z,a) = N(mu, diag(sigma^2)); mean
                        # stays affine in action so R15's zero action-curvature
                        # is preserved; variance head is state-only; imagination
                        # rolls out rsamples with gradient flow) | operator
                        # (z'=A(z)z+B(z)a, the dual-latent controlled-operator
                        # model; A=I+Â near-identity, still affine-in-a so R15
                        # holds; see model.operator below)
  operator:             # only used when model.dynamics=operator. A(z) is a
                        # learned matrix FIELD; these keep it a coherent operator
                        # bundle, not an unconstrained hypernetwork in disguise.
    structure: none     # none | symmetric (A := (A+Aᵀ)/2: real spectrum, no rotations)
    rank: 0             # 0 = full A(z); r>0 = low-rank A = U(z)V(z)ᵀ + I (≤r modes)
    w_normal: 0.0       # ‖AAᵀ−AᵀA‖²: 0 ⇔ A normal (clean spectral decomp, keeps rotations)
    w_smooth: 0.0       # ‖A(zᵢ)−A(zⱼ)‖²/‖zᵢ−zⱼ‖²: slowly-varying operator field (a connection)
    w_spread: 0.0       # −entropy(σ): maximize effective rank / several balanced modes
                        #              (anti mode-collapse; NOT −Var, which favors 1 dominant mode)
    w_radius: 0.0       # relu(σ_max−1)²: soft spectral-radius bound (near-marginal stability)
  dual_latent:          # dual-latent controlled-operator model (needs dynamics=operator;
                        # incompatible with spectral/ensemble). Shared encoder z splits
                        # into dynamics latent d=D(z) and policy latent p=P(z); reward/
                        # policy/value read p. Resolves the one-representation tension.
    enabled: false
    mode: shared        # shared = ONE operator on z, d&p are readouts (option 1)
                        # twin   = TWO operators (op_d rolls d, op_p rolls p) (option 3)
    d_dim: 0            # 0 = latent_dim
    p_dim: 0            # 0 = latent_dim
    couple_weight: 0.0  # twin: weak L_couple = ‖W_d d − W_p p‖² (ties the two geometries)
    couple_dim: 0       # 0 = min(d_dim, p_dim)
    p_consistency_weight: 1.0   # twin: ‖op_p(p,a) − P(z')‖² grounds the policy operator
    penalize_reward: true   # apply the curvature penalty (R10/R16) on the reward in
                            # p-coords. Set FALSE to let the policy latent p be ROUGH
                            # (carry sharp reward/value structure) — the "do we even
                            # need lambda for twin?" ablation (PM 2026-06-13).
    smooth_p: true      # twin: regularize the policy operator op_p with the same
                        # structural priors as op_d (model.operator.w_*) = CONJOINED
                        # smoothness. false = leave p ROUGH (op_p unregularized) while
                        # op_d keeps the dynamics latent SMOOTH = SEPARATE smoothness.
    radius_p: 0.0       # cf4 (PM 2026-06-14): with smooth_p=false, op_p is fully
                        # unregularized and its spectral radius drifts >1 (≈1.06),
                        # making imagined p-rollouts diverge → NaN. radius_p>0 (e.g.
                        # 0.1, matching op_d's w_radius) reinstates ONLY the radius
                        # prior relu(σ_max−1)² on op_p — keeps p ROUGH but not
                        # EXPANSIVE. 0 = off (cf3 behaviour).
    rank2_frame:        # cf5 (PM 2026-06-14): organize the latent into a RANK-2 frame
                        # of two orthogonal axes with opposed senses — reward-ascent
                        # (∇_z R, the p/control axis) ⊥ energy-descent (the d/dynamics
                        # axis). 'we really only need rank-2-ness' (a running gait is a
                        # 2D limit cycle). Pairs with model.operator.rank=2. Default off.
      enabled: false
      energy_anchor: 0.0     # cf7-fix (PM 2026-06-14): add anchor·½‖d‖² (latent kinetic
                        # energy) to the learned E head so it CAN'T collapse to a constant.
                        # Without it E→const trivially zeros both one-sided penalties
                        # (dissip + lyap observed exactly 0 in cf6/cf7 — the energy term
                        # was vacuous). >0 (e.g. 1.0) makes the energy non-degenerate.
      energy_mode: lyapunov  # lyapunov = a learned scalar E(d), axis −∇_z E(D(z)),
                        # grounded by relu(E(op_d(d,0))−E(d)) (autonomous drift descends
                        # it). | contractive = op_d's smallest right-singular vector
                        # (most-contracted dynamics direction), pulled back to z; no head.
      w_ortho: 0.0      # weight on cos²(∇_z R, ∇_z E) → 0 (square up the frame). The
                        # only double-backward term — subsampled (see subsample).
      w_rank2: 0.0      # weight on the covariance eigenvalue tail beyond top-`target_rank`
                        # (press z into a rank-2 subspace; the gram_eff_rank→2 objective).
      w_lyap: 0.0       # lyapunov only: weight on the energy-grounding residual.
      w_dissip: 0.0     # cf6 (PM 2026-06-14): the SOFTER alternative to hard ∇R⊥∇E
                        # orthogonality — a dissipativity/passivity inequality
                        # relu(E(d')−E(d) − supply): energy may climb only as much as
                        # the reward earns it. One-sided ⇒ lets a gait BUILD energy for
                        # reward (autonomous supply=0 recovers Lyapunov descent). Drop
                        # w_ortho→0 to use this INSTEAD of orthogonality. Lyapunov only.
      supply: reward    # dissipativity supply rate: reward = per-step real reward (wired,
                        # clean — model update). advantage|return = imagined-rollout
                        # generalizations (future; need energy in p-space). Falls back to
                        # reward with a warning if set to an unwired mode.
      subsample: 64     # batch rows used for the orthogonality double-backward (cost cap).
      target_rank: 2    # the target effective rank of the representation.
      balance: false    # cf7 (PM 2026-06-14): equilibrium-couple the alignment (couple)
                        # and energy (dissipativity) penalties — normalize each by its
                        # running magnitude before summing so neither outweighs the other
                        # (the fixed couple_weight / w_dissip are then BYPASSED). The
                        # equilibrium point is balanced gradient influence. Needs the
                        # dissipativity (lyapunov energy + w_dissip path). Default off.
      balance_weight: 0.1   # the common (normalized) strength each side is held at.
      balance_decay: 0.99   # EMA decay for the per-side running magnitudes.
  latent_dim: 4         # capped at 4x obs_dim (user rule v2: wider latent ->
                        # more null nodes / longer tails; e.g. 12 on Pendulum)
  hidden: 256
  depth: 2
  ema_decay: 0.995
  symlog_reward: true   # reward model predicts symlog(r); imagination symexps it back
  reward_heads: 3       # ensemble: shared trunk + N linear heads (1 = plain model)

penalty:
  n_probes: 2           # validated default (R4); sweep {1,2,4,8} = experiment 3
  form: laplacian_trace # DEFAULT = the user's recipe: clamped decaying trace
                        # (frobenius | laplacian_trace; R5: same Euler-Lagrange)
  clamp_trace: true     # laplacian_trace only: max(est, 0) per sample — the
                        # 'thermodynamic consistency' clamp (original findings
                        # report sec.3: clamped +41 beat Frobenius -40; unclamped -79).
                        # 'clamped decaying trace' = this + a decaying schedule.
  penalize_dynamics: false   # R+T optional (R8/R9); NEVER add policy (R10)
  disagreement_gate:    # MODEL-paced lambda: scale lam(t) by the reward-head
                        # ensemble's epistemic state. Full strength while the
                        # heads disagree (model uncertain, early), released
                        # toward `floor` as they converge (R12 anneal driven by
                        # the model, not the clock; signal = reward-head std,
                        # the very object the penalty regularizes). The gate is
                        # in [floor, 1] (never boosts above the schedule; R14:
                        # lam*>0 so floor>0). Needs reward_heads>=2 + a trained
                        # reward model (non-spectral, or spectral+encoder_aux).
    enabled: false      # DEFAULT OFF = exact current behaviour (clean ablation)
    floor: 0.1          # gate floor: lam never released below floor*schedule
    decay: 0.99         # disagreement EMA decay (same family as adaptive horizon)
  return_gate:          # RETURN-paced lambda (PM 2026-06-13): weakly tie lam(t) to
                        # ACTUAL eval return. ABSOLUTE + SIGN-AWARE + SMOOTH.
                        # shape=quadratic (default): FULL-RANGE parabola over the band
                        # [mid-scale, mid+scale] — gate = floor + (1-floor)*(1-frac²),
                        # frac = ((clip((R̄-mid)/scale,-1,1))+1)/2 — λ varies smoothly
                        # with return on BOTH sides of mid (a continuous slope to
                        # follow; 1 below mid-scale, floor above mid+scale, 0.875 at mid).
                        # shape=sigmoid: gate = floor + (1-floor)*(1 - σ((R̄-mid)/scale)).
                        # genuinely-positive return (R̄≫mid) → gate→floor (relax lam);
                        # negative (R̄≪mid) → gate→1 (hold lam high); R̄≈mid → middle
                        # of [floor,1] (NO spike near zero). Keyed on ACTUAL (not
                        # imagined) return ⇒ exploitation (high imagined/low actual)
                        # keeps return low ⇒ lam stays high (self-correcting; defuses
                        # the episode-reward feedback mode recorded 2026-06-11).
                        # gate in [floor,1]; floor>0 ⇒ lam never hits zero (R14).
    enabled: false      # DEFAULT OFF
    floor: 0.1          # gate ∈ [floor,1]: when return is genuinely good, lam relaxes
                        # to floor*schedule (here 10%); floor>0 ⇒ never zero (R14).
                        # 0.5 was too high (PM) — set lower still (0.05/0.02) if wanted.
    decay: 0.95         # return EMA decay (eval is sparse, so a slower EMA)
    shape: quadratic    # MONOTONE: quadratic (p=2 convex) | cuberoot (p=1/3 concave)
                        # | sigmoid — λ relaxed as return rises (relax=1-frac^p).
                        # PEAKED: bump — MAX λ at mid (return≈0 "phase transition"),
                        # released quadratically above AND below (relax=1-u²).
    mid: 0.0            # return anchor: gate=full for R̄≤mid, relaxes for R̄>mid;
                        # 0 = the do-nothing boundary on HalfCheetah → distinguishes +/-
    scale: 100.0        # return units over which the gate relaxes mid→mid+scale (quadratic)
                        # / sigmoid transition width; set to the env's good return level
    slew: 0.1           # max |Δgate| per eval — a collapse can't spike lam (anti-spike)
  auto_dose:            # auto-set lam0 from the measured fit/penalty scale ratio
    enabled: true       # DEFAULT ON: dose measured per env (presets that need
                        # fixed doses disable it explicitly)
    target_ratio: 0.1   # lam0 = target_ratio * mean_fit_loss / mean_penalty
    warmup_updates: 500 # model updates run at lam=0; dose measured on the tail 20%
    lam0_max: 10.0      # hard cap (small-init models start near-linear -> ratio can explode)
  schedule:             # R12
    kind: cuberoot      # DEFAULT = (t0/(t0+t))^(1/3): MONOTONIC decay over the run
                        # to a non-zero floor (PM 2026-06-13: lambda decays over the
                        # course of the run and never hits zero). Was sin2chirp (the
                        # trace-chirp exploration); experiment configs that need a
                        # specific schedule pin it explicitly (e.g. founding.yaml).
                        # cuberoot | step | cosine | constant | sin2chirp | sincos
                        # sincos: lam0*env*((sin 2pi t/period0 + cos 2pi t/period2)^2)/2
                        # — two-oscillator interference; beat = 1/|1/p0 - 1/p2|
    # period2: 10000    # sincos: second oscillator period (period2_mode=free)
    # period2_mode: multiple  # f2 = period2_mult * f1 — commensurate/resonant
    # period2_mult: 4         # set to the latent/tensor rank
    # period2_mode: golden    # incommensurate control (quasi-periodic nulls)
                        # sin2chirp: lam0*(1-t/T)*sin^2(chirped phase) — pow-free
                        # linear envelope; slow clamp/release cycles early,
                        # faster+smaller late; needs total_steps (else t0/(t0+t))
    # period0: 20000    # sin2chirp: initial steps per oscillation
    # period_end: 2000  # sin2chirp: final steps per oscillation
    lam0: 1.0e-3        # NOTE: the original HalfCheetah recipe used lam=0.5
                        # (findings report sec.7) — dose per environment; the
                        # multitask F2 finding also says 1e-3 under-doses
    t0: 10000
    floor: 1.0e-5

spectral:               # closed-form RFF spectral reward (models/spectral.py)
  enabled: false        # true => reward = SpectralReward ensemble; the MLP
                        # reward fit loss AND its Hutchinson penalty are skipped
                        # (the spectral H^2 penalty is exact); dynamics untouched
  n_features: 512
  sigma_w: 1.0          # scalar, OR a list = sigma LADDER (sigma parameterized
                        # over the transform): feature blocks drawn per
                        # bandwidth. Run-3 recipe: [0.25, 0.5, 1.0, 2.0] with a
                        # band-differentiating poly (high-clamp: degrees [1,3],
                        # coefs [0.1, 10.0]) — the ladder x polynomial
                        # INTERACTION carries the benefit (+33.7% supervised;
                        # claims_ledger bridge run 3; experiment/spectral_ladder).
                        # OR "auto" = SNR-CALIBRATED ladder (bridge run 5,
                        # +48.3% supervised): at the first refit, measure the
                        # SNR=1 crossing sigma* on the cache and place rungs at
                        # sigma* x cal_mults; logged as spectral/sigma_star,
                        # frozen for the run, checkpointed.
  cal_mults: [0.5, 1.0, 2.0, 4.0]  # sigma_w=auto rung placement (cal_low won
                        # the supervised head-to-head: +48.3% vs +38.8% for
                        # the higher placement)
                        # OR "learned" = NO manual placement at all: per-block
                        # log-scales trained by gradient on the reward fit
                        # error through the cos features ("gradients flow
                        # through the scaled pipes"); the closed-form c
                        # re-anchors on the moved basis at each refit. Logged
                        # as spectral/sigma_scale_k.
  init_ladder: [0.25, 0.5, 1.0, 2.0]  # sigma_w=learned initial scales
  sigma_lr: 1.0e-3      # sigma_w=learned: Adam lr on the per-block log-scales
  refit_every: 200      # model updates between closed-form refits
  cache_size: 4096      # rolling (x, symlog-target) cache feeding the refit
  heads: 3              # independent frequency draws = cheap exact ensemble
  poly:                 # P(|w|^2) ridge weights; default = pure quartic (H^2)
    degrees: [2]        # |w|^(2*2) = |w|^4
    coefs: [1.0]
    shifts: [0]         # per-degree time-shift (model updates) applied to the
                        # lambda schedule: theta_d(t) = coefs[d]*lam(t+shifts[d])
                        # -> phase-shifted band tuning across training
  weights_mode: poly    # poly | snr. snr = EXPLICIT Wiener weights from
                        # split-half band SNR (Tier-1 Wiener identity made
                        # load-bearing: cutoff at SNR=1, theta=(N/M)/SNR_band,
                        # no hand-tuned shape, schedule not applied).
                        # Hypothesis (user, 2026-06-08): the SNR=1 cutoff
                        # sits at sigma_eff = 1 — logged as
                        # spectral/sigma_at_snr1.
  snr_bands: 8          # |w|-quantile bands for the SNR estimate
  snr_ema: 0.9          # EMA over refits (stabilizes the split-half estimate)
  encoder_aux: true     # spectral mode: train the (otherwise bypassed) MLP
                        # reward head as an encoder-grounding auxiliary loss.
                        # WITHOUT it the encoder collapses to near-constant z
                        # on MuJoCo (dyn MSE 2e-5, returns random — observed
                        # 2026-06-08); spectral head still does all rewarding.
  encoder_aux_weight: 1.0
  recal_every: 0        # sigma_w=auto: re-probe sigma* every N refits (0=off);
                        # ladder rebuilt only if sigma* moved > recal_drift x
  recal_drift: 2.0
  sigma_wd: 1.0e-3      # sigma_w=learned: L2 anchor on log_s toward init
                        # (bounds drift toward overfit-friendly bandwidths)

smoothing:              # DreamSmooth (recipe 2.5)
  enabled: true
  sigma: 1.5

imagination:
  horizon: 15           # long horizons enabled by curvature control (R15)
  gamma: 0.99
  lambda_: 0.95         # Dreamer lambda-returns
  advantage: lambda     # lambda (default) | gae — battle-tested GAE(lambda)
                        # policy weighting (value regression identical; tested)
  entropy_coef: 3.0e-4
  value_target_decay: 0.98
  pessimism: 0.5        # imagined reward = ensemble mean - pessimism * std
  symexp_margin: 1.5    # symexp clamp = margin * running max |symlog(r)| from real batches
  reward_clip: 0.0      # cf4: hard cap on per-step imagined reward |r_im| (0 = off).
                        # Bounds the consequence of an expansive operator before it
                        # compounds into the λ-returns. Set generously (env reward
                        # is O(10)) so it bites ONLY on pathological blowups.
  return_clip: 0.0      # cf4: hard cap on the imagined λ-returns |R| (0 = off). The
                        # last line of defence before the policy/value loss — set well
                        # above healthy imagined returns (O(1-100)) so it never distorts
                        # learning, only catches inf/NaN divergence.
  align_weight: 0.0     # imagination-latent alignment (2507.16450): pull imagined
                        # latents onto the encoder manifold (match z0 mean/std) to
                        # combat drift/collapse — esp. for the long-horizon planner.
                        # DEFAULT 0 = off. Logged: imagine/align.
  adaptive_horizon:     # curvature-certified horizon: longer as penalty EMA falls
    enabled: true
    h_min: 5
    h_max: 25
    decay: 0.99         # EMA decay for penalty/value tracking

planner:                # transformer action-sequence planner (Dreamer latent-planner)
  enabled: false        # DEFAULT OFF = the per-step MLP policy actor (unchanged)
                        # ON: a causal transformer emits an H-step plan from z0;
                        # affine T predicts latents (R15); same imagination +
                        # λ-return objective (R10: never curvature-penalized);
                        # receding-horizon execution (first action). Horizon is
                        # FIXED to imagination.horizon (adaptive_horizon overridden).
  d_model: 128
  nhead: 4
  layers: 2

optim:
  model_lr: 3.0e-4
  policy_lr: 1.0e-4
  value_lr: 3.0e-4
  batch_size: 256
  amp: true             # bf16 autocast for fit losses; penalty always fp32
  actor_clip: 100.0     # actor (policy/planner) grad-norm clip — a stability lever
                        # for the long-horizon planner (lower = tamer updates)
  value_clip: 0.0       # cf4: value grad-norm clip (0 = off/unclipped, the legacy
                        # behaviour). The value net regresses to the imagined returns,
                        # so a return blowup explodes its grad too — clip it like the actor.
  skip_nonfinite: false # cf4: when true, SKIP the optimizer step (model/policy/value)
                        # whenever its grad norm is non-finite — one diverged rollout
                        # can't poison the weights, so the run recovers instead of dying
                        # in NaN. Default false = legacy (step regardless).
  # POLICY INERTIA (two-timescale stabilizer): slow EMA of the policy weights, to
  # give the policy more inertia than the (faster) operator against the collapse.
  policy_ema_decay: 0.0   # 0 = off. >0 (e.g. 0.99) maintains a slow EMA of the policy
  policy_ema_act: false   # if EMA on: act/collect with the EMA (behaviour inertia)
  policy_inertia: 0.0     # if EMA on: add inertia*‖θ_π−θ_π^ema‖² to the policy loss
                          # (weight inertia / soft trust region; MLP policy only, not planner)

training:
  total_env_steps: 100000
  steps_per_iter: 1000      # env steps collected per outer iteration
  model_updates_per_iter: 200
  behaviour_updates_per_iter: 50
  eval_every_iters: 5
  num_envs: 4               # AsyncVectorEnv workers (CPU side of Mode A)

checkpoint:
  every: 2000
  keep_last: 3
  milestone_every: 100000
  resume: auto              # auto | none | <path>
  push_wandb: true

logging:
  project: mbrl-curvature
  tensorboard: true
  dir: results
  video:                # eval rollout videos -> W&B (render failure only warns)
    enabled: true
    every_evals: 4      # record one extra rgb_array episode every Nth eval

# ---- authorable algorithm components (battle-tested; Studio graph selectors) ----
# Implemented + unit-tested in src/mbrl (critics.py, ensemble.py, planning/cem.py).
# Selectors other than the defaults are NOT yet consumed by the Trainer — the
# spec validator warns when one is authored, and each integration lands as its
# own receipted arm (founding-doc discipline). Defaults = today's behavior.
algo:
  critic: value                # value (default) | twin_q  (clipped double-Q, TD3/SAC)
  actor: gaussian              # gaussian (default) | squashed_gaussian  (SAC tanh actor)
  dynamics_ensemble: 0         # 0 = single dynamics (default) | N>=2 affine members —
                               # WIRED (2026-06-10): R15-safe ensemble replaces the
                               # dynamics; imagination uses the mean; see ensemble_pessimism
  ensemble_pessimism: 0.0      # WIRED: r_im -= coef * ensemble disagreement (epistemic
                               # discount; only active when dynamics_ensemble >= 2)
  planner: none                # none (default) | cem  (cross-entropy-method MPC)
  cem:                         # CEM params (consumed when planner=cem lands)
    horizon: 12
    pop: 256
    iters: 5
    elites: 32
